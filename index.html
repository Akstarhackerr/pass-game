<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Content Security Policy: Completely blocks dynamic evaluation & external script injection -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self'; 
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
    font-src 'self' https://fonts.gstatic.com; 
    script-src 'self' 'unsafe-inline'; 
    img-src 'self' data:; 
    object-src 'none'; 
    base-uri 'none';">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  
  <title>CYPHER-X: Secure Password Engine</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-black: #000000;
      --bg-dark-card: #080810;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;

      --color-vibrant-blue: #00ffff;
      --color-vibrant-magenta: #ff00ff;
      
      --glow-blue: 0 0 10px rgba(0, 255, 255, 0.7);
      --glow-magenta: 0 0 10px rgba(255, 0, 255, 0.7);
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: 'Share Tech Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      width: 100%;
      max-width: 600px;
    }

    .cx-logo-svg {
      width: 110px;
      height: 110px;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.6)) drop-shadow(0 0 12px rgba(255, 0, 255, 0.5));
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 1.8rem;
      letter-spacing: 0.15em;
      margin: 0;
      color: var(--text-main);
      text-shadow: var(--glow-blue), var(--glow-magenta);
    }

    .brand-subtitle {
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .container {
      width: 100%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cracked-banner {
      display: none;
      background: linear-gradient(90deg, rgba(0,255,255,0.2), rgba(255,0,255,0.2));
      border: 2px solid var(--color-vibrant-blue);
      box-shadow: var(--glow-blue), var(--glow-magenta);
      padding: 1rem;
      text-align: center;
      border-radius: 4px;
      animation: pulse-glow 1.5s infinite alternate;
    }

    .cracked-banner h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.2em;
      margin: 0;
      color: var(--color-vibrant-blue);
      text-shadow: var(--glow-blue);
    }

    .cracked-banner p {
      margin: 0.3rem 0 0 0;
      font-size: 0.9rem;
      color: var(--color-vibrant-magenta);
      letter-spacing: 0.1em;
    }

    .input-section {
      background: var(--bg-dark-card);
      border: 1px solid #111;
      padding: 1.25rem;
      border-radius: 4px;
      position: relative;
    }

    .input-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      text-transform: uppercase;
      color: var(--color-vibrant-blue);
      margin-bottom: 0.5rem;
      display: block;
      text-shadow: var(--glow-blue);
    }

    textarea {
      width: 100%;
      height: 100px;
      background: #000;
      color: var(--color-vibrant-magenta);
      border: 1px solid #222;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.2rem;
      padding: 0.75rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: var(--color-vibrant-blue);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
    }

    .status-bar {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: #777;
      display: flex;
      justify-content: space-between;
    }

    .rules-list {
      display: flex;
      flex-direction: column-reverse;
      gap: 0.75rem;
    }

    .rule-card {
      background: var(--bg-dark-card);
      border: 1px solid #1a1a1a;
      padding: 1rem;
      border-radius: 4px;
      position: relative;
      transition: all 0.3s ease;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3P%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.02'/%3E%3C/svg%3E");
    }

    .rule-card.fail {
      border-color: rgba(255, 0, 255, 0.5);
      box-shadow: var(--glow-magenta);
      background-color: rgba(20, 0, 20, 0.5);
    }

    .rule-card.pass {
      border-color: rgba(0, 255, 255, 0.5);
      box-shadow: var(--glow-blue);
      background-color: rgba(0, 15, 15, 0.5);
    }

    .rule-header {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rule-card.fail .rule-header { color: var(--color-vibrant-magenta); }
    .rule-card.pass .rule-header { color: var(--color-vibrant-blue); }

    .status-icon { font-size: 1.1rem; }

    .rule-title {
      font-size: 1rem;
      color: var(--text-main);
      line-height: 1.4;
    }

    @keyframes pulse-glow {
      0% { box-shadow: var(--glow-blue); border-color: var(--color-vibrant-blue); }
      100% { box-shadow: var(--glow-magenta); border-color: var(--color-vibrant-magenta); }
    }
  </style>
</head>
<body>

  <header>
    <!-- Custom Cyberpunk Glitch CX Logo -->
    <svg class="cx-logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="cx-grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00FFFF" />
          <stop offset="100%" stop-color="#0088FF" />
        </linearGradient>
        <linearGradient id="cx-grad-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FF00FF" />
          <stop offset="100%" stop-color="#9900FF" />
        </linearGradient>
      </defs>

      <!-- Outer Cyber Shield Frame -->
      <polygon points="50,5 92,25 92,75 50,95 8,75 8,25" fill="none" stroke="url(#cx-grad-blue)" stroke-width="2" opacity="0.4" />
      <polygon points="50,10 87,28 87,72 50,90 13,72 13,28" fill="none" stroke="url(#cx-grad-magenta)" stroke-width="1.5" opacity="0.6" />

      <!-- Glitch Accent Offsets -->
      <path d="M 22,35 L 38,35 C 32,35 30,65 38,65 L 22,65" fill="none" stroke="#FF00FF" stroke-width="4" stroke-linecap="square" opacity="0.7" transform="translate(-1, 1)" />
      <path d="M 78,35 L 58,65 M 58,35 L 78,65" fill="none" stroke="#00FFFF" stroke-width="4" stroke-linecap="square" opacity="0.7" transform="translate(1, -1)" />

      <!-- Main CX Stylized Vector Elements -->
      <!-- 'C' Shape -->
      <path d="M 40,32 L 25,32 C 18,32 18,68 25,68 L 40,68" fill="none" stroke="url(#cx-grad-blue)" stroke-width="6" stroke-linecap="square" />
      <line x1="40" y1="32" x2="45" y2="32" stroke="#00FFFF" stroke-width="6" />

      <!-- 'X' Shape -->
      <path d="M 75,32 L 55,68 M 55,32 L 75,68" fill="none" stroke="url(#cx-grad-magenta)" stroke-width="6" stroke-linecap="square" />

      <!-- Core Glowing Node Details -->
      <circle cx="50" cy="50" r="3" fill="#00FFFF" />
      <line x1="8" y1="50" x2="18" y2="50" stroke="#00FFFF" stroke-width="2" />
      <line x1="82" y1="50" x2="92" y2="50" stroke="#FF00FF" stroke-width="2" />
    </svg>

    <div class="brand-title">CYPHER-X</div>
    <div class="brand-subtitle">THINKING BEYOND CODE</div>
  </header>

  <div class="container">
    <div class="cracked-banner" id="cracked-banner">
      <h2>PASSWORD CRACKED</h2>
      <p>SYSTEM ACCESS GRANTED - ALL 20 PROTOCOLS PASSED</p>
    </div>

    <div class="input-section">
      <label for="password" class="input-label">SYSTEM_ACCESS_KEY</label>
      <textarea id="password" maxlength="150" placeholder="[WAITING FOR INPUT...]"></textarea>
      <div class="status-bar">
        <span id="security-level">SECURITY LEVEL: 0/20</span>
        <span id="char-count">CHARS: 0</span>
      </div>
    </div>

    <div class="rules-list" id="rules-container"></div>
  </div>

  <script>
    "use strict";

    // Static function checks without eval() or dynamic execution
    const rules = Object.freeze([
      {
        id: 1,
        title: "Your password must be at least 6 characters long.",
        check: (pw) => pw.length >= 6
      },
      {
        id: 2,
        title: "Your password must include a number.",
        check: (pw) => /\d/.test(pw)
      },
      {
        id: 3,
        title: "Your password must include an uppercase letter.",
        check: (pw) => /[A-Z]/.test(pw)
      },
      {
        id: 4,
        title: "Your password must include a special character (!@#$%^&*).",
        check: (pw) => /[!@#$%^&*(),.?":{}|<>]/.test(pw)
      },
      {
        id: 5,
        title: "The digits in your password must add up to 25.",
        check: (pw) => {
          const digits = pw.match(/\d/g);
          if (!digits) return false;
          return digits.reduce((acc, curr) => acc + parseInt(curr, 10), 0) === 25;
        }
      },
      {
        id: 6,
        title: "Your password must include a month of the year.",
        check: (pw) => {
          const months = ["january", "february", "march", "april", "may", "june", 
                          "july", "august", "september", "october", "november", "december"];
          const lower = pw.toLowerCase();
          return months.some(m => lower.includes(m));
        }
      },
      {
        id: 7,
        title: "Your password must contain a Roman numeral (I, V, X, L, C, D, M).",
        check: (pw) => /[IVXLCDM]/.test(pw)
      },
      {
        id: 8,
        title: "Your password must contain one of our brand names: CYPHER or CX.",
        check: (pw) => /CYPHER|CX/i.test(pw)
      },
      {
        id: 9,
        title: "The Roman numerals in your password must multiply to 20 (e.g. IV * V = 20).",
        check: (pw) => pw.includes("IV") && pw.includes("V")
      },
      {
        id: 10,
        title: "Your password must include a CAPTCHA code: 7X9K",
        check: (pw) => pw.includes("7X9K")
      },
      {
        id: 11,
        title: "Your password must include a valid 6-character Hex Color Code (e.g., #00FFFF).",
        check: (pw) => /#[0-9A-Fa-f]{6}/.test(pw)
      },
      {
        id: 12,
        title: "Your password must include a planet in our solar system.",
        check: (pw) => {
          const planets = ["mercury", "venus", "earth", "mars", "jupiter", "saturn", "uranus", "neptune"];
          const lower = pw.toLowerCase();
          return planets.some(p => lower.includes(p));
        }
      },
      {
        id: 13,
        title: "Your password must include a programming language (e.g., PYTHON, JAVA, HTML).",
        check: (pw) => /PYTHON|JAVA|RUST|HTML|CSS|RUBY|SWIFT|GOLANG/i.test(pw)
      },
      {
        id: 14,
        title: "Your password must contain a valid winning chess move notation (e.g., e5, Nf3, Qh5).",
        check: (pw) => /[a-h][1-8]|[KQRBN][a-h]?[1-8]/.test(pw)
      },
      {
        id: 15,
        title: "Your password must include an emoji (e.g. 💻, ⚡, 🚀, 🎮).",
        check: (pw) => /\p{Extended_Pictographic}/u.test(pw)
      },
      {
        id: 16,
        title: "Your password must include the word 'SYSTEM' in all caps.",
        check: (pw) => pw.includes("SYSTEM")
      },
      {
        id: 17,
        title: "The length of your password must be a prime number.",
        check: (pw) => {
          const num = [...pw].length;
          if (num <= 1) return false;
          for (let i = 2, s = Math.sqrt(num); i <= s; i++) {
            if (num % i === 0) return false;
          }
          return true;
        }
      },
      {
        id: 18,
        title: "Your password must contain a double letter or symbol (e.g., 'aa', '!!').",
        check: (pw) => /(.)\1/i.test(pw)
      },
      {
        id: 19,
        title: "Your password must include an element symbol from the periodic table (e.g., Fe, Au).",
        check: (pw) => /He|Li|Be|Ne|Na|Mg|Al|Si|Fe|Au|Ag|Cu|Zn|Og/i.test(pw)
      },
      {
        id: 20,
        title: "Your password must end with an exclamation mark (!).",
        check: (pw) => pw.endsWith("!")
      }
    ]);

    const passwordInput = document.getElementById("password");
    const rulesContainer = document.getElementById("rules-container");
    const charCountDisplay = document.getElementById("char-count");
    const securityLevelDisplay = document.getElementById("security-level");
    const crackedBanner = document.getElementById("cracked-banner");

    function createCardNode(rule, isPassed) {
      const card = document.createElement("div");
      card.className = `rule-card ${isPassed ? "pass" : "fail"}`;

      const header = document.createElement("div");
      header.className = "rule-header";
      
      const ruleNum = document.createElement("span");
      ruleNum.textContent = `PROTOCOL: ${rule.id}`;

      const statusIcon = document.createElement("span");
      statusIcon.className = "status-icon";
      statusIcon.textContent = isPassed ? ">> SECURE" : ">> REQUIRED";

      header.appendChild(ruleNum);
      header.appendChild(statusIcon);

      const title = document.createElement("div");
      title.className = "rule-title";
      title.textContent = rule.title; 

      card.appendChild(header);
      card.appendChild(title);
      return card;
    }

    function updateGame() {
      const pw = passwordInput.value;
      const charLength = [...pw].length;
      
      charCountDisplay.textContent = `CHARS: ${charLength}`;
      rulesContainer.replaceChildren();

      let activeRulesCount = 0;
      let allPassed = true;

      for (let i = 0; i < rules.length; i++) {
        activeRulesCount++;
        if (!rules[i].check(pw)) {
          allPassed = false;
          break; 
        }
      }

      securityLevelDisplay.textContent = `SECURITY LEVEL: ${activeRulesCount - 1}/20`;

      if (allPassed && activeRulesCount === rules.length) {
        crackedBanner.style.display = "block";
      } else {
        crackedBanner.style.display = "none";
      }

      const fragment = document.createDocumentFragment();
      for (let i = 0; i < activeRulesCount; i++) {
        const isPassed = rules[i].check(pw);
        fragment.appendChild(createCardNode(rules[i], isPassed));
      }
      rulesContainer.appendChild(fragment);
    }

    passwordInput.addEventListener("input", updateGame);
    updateGame();
  </script>
</body>
</html>
