<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self'; 
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
    font-src 'self' https://fonts.gstatic.com; 
    script-src 'self' 'unsafe-inline'; 
    img-src 'self' data:; 
    object-src 'none'; 
    base-uri 'none';">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  
  <title>CYPHER-X: Secure Password Engine</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-black: #000000;
      --bg-dark-card: #080810;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;

      --color-vibrant-blue: #00ffff;
      --color-vibrant-magenta: #ff00ff;
      
      --glow-blue: 0 0 10px rgba(0, 255, 255, 0.7);
      --glow-magenta: 0 0 10px rgba(255, 0, 255, 0.7);
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: 'Share Tech Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      width: 100%;
      max-width: 600px;
    }

    .cx-logo-svg {
      width: 280px;
      height: auto;
      margin-bottom: 0.5rem;
      filter: drop-shadow(0 0 15px rgba(180, 0, 255, 0.4));
    }

    .container {
      width: 100%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cracked-banner {
      display: none;
      background: linear-gradient(90deg, rgba(0,255,255,0.2), rgba(255,0,255,0.2));
      border: 2px solid var(--color-vibrant-blue);
      box-shadow: var(--glow-blue), var(--glow-magenta);
      padding: 1rem;
      text-align: center;
      border-radius: 4px;
      animation: pulse-glow 1.5s infinite alternate;
    }

    .cracked-banner h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.2em;
      margin: 0;
      color: var(--color-vibrant-blue);
      text-shadow: var(--glow-blue);
    }

    .cracked-banner p {
      margin: 0.3rem 0 0 0;
      font-size: 0.9rem;
      color: var(--color-vibrant-magenta);
      letter-spacing: 0.1em;
    }

    .input-section {
      background: var(--bg-dark-card);
      border: 1px solid #111;
      padding: 1.25rem;
      border-radius: 4px;
      position: relative;
    }

    .input-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      text-transform: uppercase;
      color: var(--color-vibrant-blue);
      margin-bottom: 0.5rem;
      display: block;
      text-shadow: var(--glow-blue);
    }

    textarea {
      width: 100%;
      height: 100px;
      background: #000;
      color: var(--color-vibrant-magenta);
      border: 1px solid #222;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.2rem;
      padding: 0.75rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: var(--color-vibrant-blue);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
    }

    .status-bar {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: #777;
      display: flex;
      justify-content: space-between;
    }

    .rules-list {
      display: flex;
      flex-direction: column-reverse;
      gap: 0.75rem;
    }

    .rule-card {
      background: var(--bg-dark-card);
      border: 1px solid #1a1a1a;
      padding: 1rem;
      border-radius: 4px;
      position: relative;
      transition: all 0.3s ease;
    }

    .rule-card.fail {
      border-color: rgba(255, 0, 255, 0.5);
      box-shadow: var(--glow-magenta);
      background-color: rgba(20, 0, 20, 0.5);
    }

    .rule-card.pass {
      border-color: rgba(0, 255, 255, 0.5);
      box-shadow: var(--glow-blue);
      background-color: rgba(0, 15, 15, 0.5);
    }

    .rule-header {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rule-card.fail .rule-header { color: var(--color-vibrant-magenta); }
    .rule-card.pass .rule-header { color: var(--color-vibrant-blue); }

    .status-icon { font-size: 1.1rem; }

    .rule-title {
      font-size: 1rem;
      color: var(--text-main);
      line-height: 1.4;
    }

    @keyframes pulse-glow {
      0% { box-shadow: var(--glow-blue); border-color: var(--color-vibrant-blue); }
      100% { box-shadow: var(--glow-magenta); border-color: var(--color-vibrant-magenta); }
    }
  </style>
</head>
<body>

  <header>
    <!-- Vector recreation of the provided Cypher-X image -->
    <svg class="cx-logo-svg" viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Metallic Silver Gradient -->
        <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="30%" stop-color="#cccccc" />
          <stop offset="50%" stop-color="#888899" />
          <stop offset="70%" stop-color="#dddddd" />
          <stop offset="100%" stop-color="#555566" />
        </linearGradient>

        <!-- Neon X Glow Gradient -->
        <linearGradient id="xNeonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#4b0082" />
          <stop offset="40%" stop-color="#8a00e6" />
          <stop offset="75%" stop-color="#d000ff" />
          <stop offset="100%" stop-color="#00ffff" />
        </linearGradient>

        <!-- Subtle Text Metallic Gradient -->
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="70%" stop-color="#d8d8ff" />
          <stop offset="100%" stop-color="#c800ff" />
        </linearGradient>

        <!-- Cyber Glow Filter -->
        <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- Glitch Pixel Specks Background (Magenta / Cyan) -->
      <g opacity="0.8">
        <rect x="80" y="80" width="12" height="2" fill="#00ffff" />
        <rect x="65" y="105" width="25" height="3" fill="#ff00ff" />
        <rect x="70" y="115" width="8" height="2" fill="#00ffff" />
        <rect x="110" y="60" width="18" height="2" fill="#ffffff" />
        <rect x="360" y="90" width="15" height="3" fill="#ff00ff" opacity="0.9"/>
        <rect x="380" y="110" width="22" height="2" fill="#00ffff" />
        <rect x="340" y="135" width="30" height="4" fill="#d000ff" />
        <rect x="395" y="150" width="10" height="2" fill="#ffffff" />
      </g>

      <!-- Metallic 'C' Shape -->
      <path d="M 270,85 
               L 180,85 
               L 125,125 
               L 125,175 
               L 180,215 
               L 250,215 
               L 220,190 
               L 180,190 
               L 155,168 
               L 155,132 
               L 180,110 
               L 250,110 
               Z" 
            fill="url(#metalGrad)" 
            stroke="#111" 
            stroke-width="1" />

      <!-- Inner C Cutout Shadow Accent -->
      <path d="M 155,132 L 180,110 L 250,110 L 235,125 L 180,125 L 165,138 Z" fill="#444455" opacity="0.6"/>

      <!-- Stylized Sharp 'X' Overlaid -->
      <g filter="url(#neonGlow)">
        <!-- Main diagonal (bottom-left sharp spike to top-right tip) -->
        <path d="M 175,235 
                 L 270,140 
                 L 415,50 
                 L 350,150 
                 L 285,210 
                 Z" 
              fill="url(#xNeonGrad)" />

        <!-- Crossing diagonal (top-left to bottom-right tip) -->
        <path d="M 260,105 
                 L 300,135 
                 L 395,235 
                 L 310,180 
                 L 275,150 
                 Z" 
              fill="url(#xNeonGrad)" />

        <!-- Sharp Cyan Highlight Line inside X -->
        <polyline points="180,230 270,140 405,55" fill="none" stroke="#00ffff" stroke-width="2.5" />
      </g>

      <!-- Horizontal Glitch Cut-Lines across CX -->
      <rect x="100" y="102" width="120" height="2" fill="#000000" />
      <rect x="230" y="130" width="150" height="3" fill="#000000" />
      <rect x="110" y="160" width="90" fill="#000000" height="2" />

      <!-- CYPHER-X Main Text -->
      <text x="250" y="270" 
            font-family="'Orbitron', sans-serif" 
            font-weight="900" 
            font-size="38" 
            fill="url(#textGrad)" 
            text-anchor="middle" 
            letter-spacing="6">CYPHER-X</text>

      <!-- Subtitle Tagline with Side Glitch Brackets -->
      <g opacity="0.9">
        <text x="250" y="298" 
              font-family="'Share Tech Mono', monospace" 
              font-size="14" 
              fill="#d080ff" 
              text-anchor="middle" 
              letter-spacing="4">THINKING BEYOND CODE.</text>
        
        <!-- Left Subtitle Glitch Line -->
        <line x1="60" y1="293" x2="110" y2="293" stroke="#00ffff" stroke-width="2" />
        <rect x="80" y="291" width="6" height="5" fill="#ff00ff" />
        
        <!-- Right Subtitle Glitch Line -->
        <line x1="390" y1="293" x2="440" y2="293" stroke="#00ffff" stroke-width="2" />
        <rect x="410" y="291" width="6" height="5" fill="#ff00ff" />
      </g>
    </svg>
  </header>

  <div class="container">
    <div class="cracked-banner" id="cracked-banner">
      <h2>PASSWORD CRACKED</h2>
      <p>SYSTEM ACCESS GRANTED - ALL 20 PROTOCOLS PASSED</p>
    </div>

    <div class="input-section">
      <label for="password" class="input-label">SYSTEM_ACCESS_KEY</label>
      <textarea id="password" maxlength="150" placeholder="[WAITING FOR INPUT...]"></textarea>
      <div class="status-bar">
        <span id="security-level">SECURITY LEVEL: 0/20</span>
        <span id="char-count">CHARS: 0</span>
      </div>
    </div>

    <div class="rules-list" id="rules-container"></div>
  </div>

  <script>
    "use strict";

    const rules = Object.freeze([
      {
        id: 1,
        title: "Your password must be at least 6 characters long.",
        check: (pw) => pw.length >= 6
      },
      {
        id: 2,
        title: "Your password must include a number.",
        check: (pw) => /\d/.test(pw)
      },
      {
        id: 3,
        title: "Your password must include an uppercase letter.",
        check: (pw) => /[A-Z]/.test(pw)
      },
      {
        id: 4,
        title: "Your password must include a special character (!@#$%^&*).",
        check: (pw) => /[!@#$%^&*(),.?":{}|<>]/.test(pw)
      },
      {
        id: 5,
        title: "The digits in your password must add up to 25.",
        check: (pw) => {
          const digits = pw.match(/\d/g);
          if (!digits) return false;
          return digits.reduce((acc, curr) => acc + parseInt(curr, 10), 0) === 25;
        }
      },
      {
        id: 6,
        title: "Your password must include a month of the year.",
        check: (pw) => {
          const months = ["january", "february", "march", "april", "may", "june", 
                          "july", "august", "september", "october", "november", "december"];
          const lower = pw.toLowerCase();
          return months.some(m => lower.includes(m));
        }
      },
      {
        id: 7,
        title: "Your password must contain a Roman numeral (I, V, X, L, C, D, M).",
        check: (pw) => /[IVXLCDM]/.test(pw)
      },
      {
        id: 8,
        title: "Your password must contain one of our brand names: CYPHER or CX.",
        check: (pw) => /CYPHER|CX/i.test(pw)
      },
      {
        id: 9,
        title: "The Roman numerals in your password must multiply to 20 (e.g. IV * V = 20).",
        check: (pw) => pw.includes("IV") && pw.includes("V")
      },
      {
        id: 10,
        title: "Your password must include a CAPTCHA code: 7X9K",
        check: (pw) => pw.includes("7X9K")
      },
      {
        id: 11,
        title: "Your password must include a valid 6-character Hex Color Code (e.g., #00FFFF).",
        check: (pw) => /#[0-9A-Fa-f]{6}/.test(pw)
      },
      {
        id: 12,
        title: "Your password must include a planet in our solar system.",
        check: (pw) => {
          const planets = ["mercury", "venus", "earth", "mars", "jupiter", "saturn", "uranus", "neptune"];
          const lower = pw.toLowerCase();
          return planets.some(p => lower.includes(p));
        }
      },
      {
        id: 13,
        title: "Your password must include a programming language (e.g., PYTHON, JAVA, HTML).",
        check: (pw) => /PYTHON|JAVA|RUST|HTML|CSS|RUBY|SWIFT|GOLANG/i.test(pw)
      },
      {
        id: 14,
        title: "Your password must contain a valid winning chess move notation (e.g., e5, Nf3, Qh5).",
        check: (pw) => /[a-h][1-8]|[KQRBN][a-h]?[1-8]/.test(pw)
      },
      {
        id: 15,
        title: "Your password must include an emoji (e.g. 💻, ⚡, 🚀, 🎮).",
        check: (pw) => /\p{Extended_Pictographic}/u.test(pw)
      },
      {
        id: 16,
        title: "Your password must include the word 'SYSTEM' in all caps.",
        check: (pw) => pw.includes("SYSTEM")
      },
      {
        id: 17,
        title: "The length of your password must be a prime number.",
        check: (pw) => {
          const num = [...pw].length;
          if (num <= 1) return false;
          for (let i = 2, s = Math.sqrt(num); i <= s; i++) {
            if (num % i === 0) return false;
          }
          return true;
        }
      },
      {
        id: 18,
        title: "Your password must contain a double letter or symbol (e.g., 'aa', '!!').",
        check: (pw) => /(.)\1/i.test(pw)
      },
      {
        id: 19,
        title: "Your password must include an element symbol from the periodic table (e.g., Fe, Au).",
        check: (pw) => /He|Li|Be|Ne|Na|Mg|Al|Si|Fe|Au|Ag|Cu|Zn|Og/i.test(pw)
      },
      {
        id: 20,
        title: "Your password must end with an exclamation mark (!).",
        check: (pw) => pw.endsWith("!")
      }
    ]);

    const passwordInput = document.getElementById("password");
    const rulesContainer = document.getElementById("rules-container");
    const charCountDisplay = document.getElementById("char-count");
    const securityLevelDisplay = document.getElementById("security-level");
    const crackedBanner = document.getElementById("cracked-banner");

    function createCardNode(rule, isPassed) {
      const card = document.createElement("div");
      card.className = `rule-card ${isPassed ? "pass" : "fail"}`;

      const header = document.createElement("div");
      header.className = "rule-header";
      
      const ruleNum = document.createElement("span");
      ruleNum.textContent = `PROTOCOL: ${rule.id}`;

      const statusIcon = document.createElement("span");
      statusIcon.className = "status-icon";
      statusIcon.textContent = isPassed ? ">> SECURE" : ">> REQUIRED";

      header.appendChild(ruleNum);
      header.appendChild(statusIcon);

      const title = document.createElement("div");
      title.className = "rule-title";
      title.textContent = rule.title; 

      card.appendChild(header);
      card.appendChild(title);
      return card;
    }

    function updateGame() {
      const pw = passwordInput.value;
      const charLength = [...pw].length;
      
      charCountDisplay.textContent = `CHARS: ${charLength}`;
      rulesContainer.replaceChildren();

      let activeRulesCount = 0;
      let allPassed = true;

      for (let i = 0; i < rules.length; i++) {
        activeRulesCount++;
        if (!rules[i].check(pw)) {
          allPassed = false;
          break; 
        }
      }

      securityLevelDisplay.textContent = `SECURITY LEVEL: ${activeRulesCount - 1}/20`;

      if (allPassed && activeRulesCount === rules.length) {
        crackedBanner.style.display = "block";
      } else {
        crackedBanner.style.display = "none";
      }

      const fragment = document.createDocumentFragment();
      for (let i = 0; i < activeRulesCount; i++) {
        const isPassed = rules[i].check(pw);
        fragment.appendChild(createCardNode(rules[i], isPassed));
      }
      rulesContainer.appendChild(fragment);
    }

    passwordInput.addEventListener("input", updateGame);
    updateGame();
  </script>
</body>
</html>
