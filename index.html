<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYPHER-X: The Password System</title>
  
  <!-- Custom Fonts (simulating the image style) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       1. CORE THEME & LAYOUT (CYPHER-X)
    ========================================= */
    :root {
      --bg-black: #000000;
      --bg-dark-card: #080810;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;

      /* Glitch/Neon Palette from Image */
      --color-vibrant-blue: #00ffff;
      --color-vibrant-magenta: #ff00ff;
      
      --glow-blue: 0 0 10px rgba(0, 255, 255, 0.7);
      --glow-magenta: 0 0 10px rgba(255, 0, 255, 0.7);
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: 'Share Tech Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* =========================================
       2. GLITCH LOGO HEADER (Based on image_0.png)
    ========================================= */
    header {
      text-align: center;
      margin-bottom: 2rem;
      width: 100%;
      max-width: 600px;
    }

    /* Container for the CX icon + glitch */
    .cx-icon-container {
      position: relative;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 5rem;
      line-height: 1;
      margin-bottom: 1rem;
      color: white;
    }

    .cx-text { display: block; position: relative; z-index: 10; }

    /* The glowing glitch effect behind/around CX */
    .cx-glitch-layer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      opacity: 0.8;
      pointer-events: none;
    }

    .cx-glitch-layer::before, .cx-glitch-layer::after {
      content: 'CX';
      position: absolute;
      top: 0; left: 0; width: 100%;
    }

    /* Magenta glitch line on the right */
    .cx-glitch-layer::before {
      color: var(--color-vibrant-magenta);
      filter: blur(1px);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 80% 100%);
      animation: glitch-anim-magenta 2.5s infinite linear alternate-reverse;
    }

    /* Blue glitch line on the left */
    .cx-glitch-layer::after {
      color: var(--color-vibrant-blue);
      filter: blur(1px);
      clip-path: polygon(0 0, 20% 0, 20% 100%, 0 100%);
      animation: glitch-anim-blue 3.2s infinite linear alternate-reverse;
    }

    /* The Main Title Text */
    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 1.8rem;
      letter-spacing: 0.15em;
      margin: 0;
      color: var(--text-main);
      text-shadow: var(--glow-blue), var(--glow-magenta);
    }

    /* The Subtitle from image */
    .brand-subtitle {
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* =========================================
       3. INTERFACE ELEMENTS
    ========================================= */
    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .input-section {
      background: var(--bg-dark-card);
      border: 1px solid #111;
      padding: 1.25rem;
      border-radius: 4px;
      position: relative;
    }

    .input-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      text-transform: uppercase;
      color: var(--color-vibrant-blue);
      margin-bottom: 0.5rem;
      display: block;
      text-shadow: var(--glow-blue);
    }

    textarea {
      width: 100%;
      height: 90px;
      background: #000;
      color: var(--color-vibrant-magenta);
      border: 1px solid #222;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.2rem;
      padding: 0.75rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: var(--color-vibrant-blue);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
    }

    .status-bar {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: #555;
      display: flex;
      justify-content: space-between;
    }

    /* =========================================
       4. RULE CARDS (Glitch/Neon)
    ========================================= */
    .rules-list {
      display: flex;
      flex-direction: column-reverse; /* New rules on top */
      gap: 0.75rem;
    }

    .rule-card {
      background: var(--bg-dark-card);
      border: 1px solid #1a1a1a;
      padding: 1rem;
      border-radius: 4px;
      position: relative;
      transition: all 0.3s ease;
      
      /* Initial subtle noise texture (SVG data image) */
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3P%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.02'/%3E%3C/svg%3E");
    }

    /* FAIL (Initial State - Magenta Glow) */
    .rule-card.fail {
      border-color: rgba(255, 0, 255, 0.5);
      box-shadow: var(--glow-magenta);
      background-color: rgba(20, 0, 20, 0.5);
    }

    /* SUCCESS (Blue Glow) */
    .rule-card.pass {
      border-color: rgba(0, 255, 255, 0.5);
      box-shadow: var(--glow-blue);
      background-color: rgba(0, 15, 15, 0.5);
    }

    .rule-header {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rule-card.fail .rule-header { color: var(--color-vibrant-magenta); }
    .rule-card.pass .rule-header { color: var(--color-vibrant-blue); }

    .status-icon { font-size: 1.1rem; }

    .rule-title {
      font-size: 1rem;
      color: var(--text-main);
      line-height: 1.4;
    }

    /* Special glitch effect on active rule */
    .rules-list > div:last-child {
      animation: card-glitch-intro 0.5s ease-out;
    }

    /* =========================================
       5. ANIMATIONS
    ========================================= */
    @keyframes glitch-anim-magenta {
      0% { clip-path: polygon(0 0, 100% 0, 100% 100%, 80% 100%); }
      20% { clip-path: polygon(0 20%, 100% 20%, 100% 100%, 75% 100%); }
      60% { clip-path: polygon(0 0, 100% 0, 100% 80%, 90% 80%); }
      100% { clip-path: polygon(0 50%, 100% 50%, 100% 100%, 85% 100%); }
    }

    @keyframes glitch-anim-blue {
      0% { clip-path: polygon(0 0, 20% 0, 20% 100%, 0 100%); }
      30% { clip-path: polygon(0 10%, 25% 10%, 25% 100%, 0 100%); }
      70% { clip-path: polygon(0 0, 15% 0, 15% 90%, 0 90%); }
      100% { clip-path: polygon(0 40%, 30% 40%, 30% 100%, 0 100%); }
    }

    @keyframes card-glitch-intro {
      0% { transform: translateY(10px); opacity: 0; filter: blur(5px) hue-rotate(90deg); }
      50% { transform: translateY(0px); opacity: 1; filter: blur(1px) hue-rotate(0deg); }
      70% { clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%); }
      90% { clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%); }
      100% { clip-path: none; filter: none; }
    }
  </style>
</head>
<body>

  <!-- CYPHER-X BRANDING HEADER -->
  <header>
    <div class="cx-icon-container">
      <div class="cx-glitch-layer"></div>
      <div class="cx-text">CX</div>
    </div>
    <div class="brand-title">CYPHER-X</div>
    <div class="brand-subtitle">THINKING BEYOND CODE</div>
  </header>

  <!-- PASSWORD GAME INTERFACE -->
  <div class="container">
    <div class="input-section">
      <label for="password" class="input-label">SYSTEM_ACCESS_KEY</label>
      <textarea id="password" placeholder="[WAITING FOR INPUT...]"></textarea>
      <div class="status-bar">
        <span>SECURITY LEVEL: 0</span>
        <span id="char-count">CHARS: 0</span>
      </div>
    </div>

    <!-- Active rules will be injected here -->
    <div class="rules-list" id="rules-container"></div>
  </div>

  <script>
    // =========================================
    // 6. GAME LOGIC (As before)
    // =========================================

    const rules = [
      {
        id: 1,
        title: "Your password must be at least 5 characters long.",
        check: (pw) => pw.length >= 5
      },
      {
        id: 2,
        title: "Your password must include a number.",
        check: (pw) => /\d/.test(pw)
      },
      {
        id: 3,
        title: "Your password must include an uppercase letter.",
        check: (pw) => /[A-Z]/.test(pw)
      },
      {
        id: 4,
        title: "Your password must include a special character (!@#$%^&*).",
        check: (pw) => /[!@#$%^&*(),.?":{}|<>]/.test(pw)
      },
      {
        id: 5,
        title: "The digits in your password must add up to 25.",
        check: (pw) => {
          const digits = pw.match(/\d/g);
          if (!digits) return false;
          const sum = digits.reduce((acc, curr) => acc + parseInt(curr), 0);
          return sum === 25;
        }
      },
      {
        id: 6,
        title: "Your password must include a month of the year.",
        check: (pw) => {
          const months = ["january", "february", "march", "april", "may", "june", 
                          "july", "august", "september", "october", "november", "december"];
          return months.some(month => pw.toLowerCase().includes(month));
        }
      },
      {
        id: 7,
        title: "Your password must contain a Roman numeral (I, V, X, L, C, D, M).",
        check: (pw) => /[IVXLCDM]/.test(pw)
      }
    ];

    const passwordInput = document.getElementById("password");
    const rulesContainer = document.getElementById("rules-container");
    const charCountDisplay = document.getElementById("char-count");

    function updateGame() {
      const pw = passwordInput.value;
      charCountDisplay.textContent = `CHARS: ${pw.length}`;

      rulesContainer.innerHTML = "";

      let activeRulesCount = 0;
      for (let i = 0; i < rules.length; i++) {
        activeRulesCount++;
        if (!rules[i].check(pw)) {
          break; 
        }
      }

      for (let i = 0; i < activeRulesCount; i++) {
        const rule = rules[i];
        const isPassed = rule.check(pw);

        const card = document.createElement("div");
        card.className = `rule-card ${isPassed ? "pass" : "fail"}`;

        const header = document.createElement("div");
        header.className = "rule-header";
        
        const statusIcon = document.createElement("span");
        statusIcon.className = "status-icon";
        statusIcon.textContent = isPassed ? ">> SECURE" : ">> REQUIRED";

        const ruleNum = document.createElement("span");
        ruleNum.textContent = `PROTOCOL: ${rule.id}`;

        header.appendChild(ruleNum);
        header.appendChild(statusIcon);

        const title = document.createElement("div");
        title.className = "rule-title";
        title.textContent = rule.title;

        card.appendChild(header);
        card.appendChild(title);
        rulesContainer.appendChild(card);
      }
    }

    passwordInput.addEventListener("input", updateGame);
    updateGame(); // Initial run
  </script>
</body>
</html>
